name: portly
description: "See what's running on your ports — and free them in one click."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  tray_manager: ^0.8.2
  window_manager: ^0.6.0
  package_info_plus: ^10.2.2
  local_notifier: ^0.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/portly_tray_22.png
    - assets/icons/portly_tray_32.png
    - assets/icons/portly_128.png
